# config.yaml DEFAULT para instalacao automatica
# URL oficial do servidor (Render Producao) - NAO ALTERE
server_url: "https://print-collect.onrender.com"

# Token de agente - sera substituido pelo Wizard de Pareamento
agent_token: "agent-dev-key"

# Versao do agente (v6.9.8 = FIX NUCLEAR v6.9.7: (A) NameError 'os' _run_ps faltavam imports os/tempfile no topo. (B) _wmic_csv_to_dicts SKIPA coluna Node (hostname do PC, SEMPRE 1a coluna wmic CSV) + filtro QUOTING_MINIMAL, senao virava 83 impressoras falsas (Win32_Printer, DESKTOP-E02OP26, lista de papel com virgulas). (C) Filtro rigido FAKE_NAMES em printer fallback: descarta nomes que nao sao de impressora real. (D) Portas TCPIPPrinterPort e printerport VOLTAM para /format:list provado v6.9.6 (38 portas reais, v6.9.7 CSV dava 261 falsas!). Printer + Queue CONTINUAM com /format:csv.)
agent_version: "6.9.8"

# Intervalo de coleta em minutos (30 min = padrao do cliente Julio)
interval_minutes: 30

# Caminho do log (deixa comentado = usa C:\ProgramData\PrintCollect\agent.log)
# log_file: "C:\\ProgramData\\PrintCollect\\agent.log"

# Configuracoes SNMP (descoberta de impressoras)
snmp:
  community: "public"
  timeout: 5
  subnets: []
  ips: []
