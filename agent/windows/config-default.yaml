# config.yaml DEFAULT para instalacao automatica
# URL oficial do servidor (Render Producao) - NAO ALTERE
server_url: "https://print-collect.onrender.com"

# Token de agente - sera substituido pelo Wizard de Pareamento
agent_token: "agent-dev-key"

# Versao do agente (v6.9.9 = FIX TRAVAMENTO WIZARD no Joaquim: (A) CAMADA 3/3 cmd_install _exe_cmd ganhou timeout=90s max subprocess (antes sem timeout travava). (B) _snmp_quick_read REESCRITO com ThreadPoolExecutor timeout global 6.5s + 1 tentativa 'public' 2.5s (antes 2 comunidades x 2 tentativas x 4s podia TRAVAR UDP infinitamente em impressora tipo Canon G3111 WiFi (sem resposta SNMP), causava loop USB travar = Wizard nao fechar + contador zero Canon). v6.9.8 = FIX NameError scoping os/tempfile / WMIC CSV Node / 83 falsas / 261 portas falsas / MissingCatchOrFinally PS / dup 3x / port=?.)
agent_version: "6.9.9"

# Intervalo de coleta em minutos (30 min = padrao do cliente Julio)
interval_minutes: 30

# Caminho do log (deixa comentado = usa C:\ProgramData\PrintCollect\agent.log)
# log_file: "C:\\ProgramData\\PrintCollect\\agent.log"

# Configuracoes SNMP (descoberta de impressoras)
snmp:
  community: "public"
  timeout: 5
  subnets: []
  ips: []
