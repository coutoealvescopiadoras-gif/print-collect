# config.yaml DEFAULT para instalacao automatica
# URL oficial do servidor (Render Producao) - NAO ALTERE
server_url: "https://print-collect.onrender.com"

# Token de agente - sera substituido pelo Wizard de Pareamento
agent_token: "agent-dev-key"

# Versao do agente (v6.9.11 = CORRECAO CRITICA v6.9.10! Build v6.9.10 tinha EXEs ANTIGOS compilados antes dos fixes (CAMADA3/3 ainda ligada no .exe!), além disso register-startup-task-silent.bat TAMBEM TINHA CAMADA3/3 rodando once no final (linha validacao) que causava RC=255 no BAT e travamento do Wizard. v6.9.11 APLICA TODAS LIMPEZAS ANTI-TRAVAMENTO e GARANTE EXES e BAT ATUALIZADOS no setup: (1) CAMADA3/3 cmd_install Python DESLIGADA (nao roda once no final Wizard); (2) USB->SNMP fallback REMOVIDO; (3) collect_all_usb TIMEOUT GLOBAL 45s; (4) CAMADA3/3 do register-startup-task-silent.bat TAMBEM DESLIGADA (nao roda once no final do BAT). Todo resto: scaneamento automatico rede SNMP, contadores P&B/Color/Total, cards toner CMYK separados, Konicas/Ricoh/Epson, agendamento 30/30 min, extra-targets servidor, instalacao manual impressoras SNMP: 100% IGUAL as versoes boas, nada alterado, sem regressao!)
agent_version: "6.9.11"

# Intervalo de coleta em minutos (30 min = padrao do cliente Julio)
interval_minutes: 30

# Caminho do log (deixa comentado = usa C:\ProgramData\PrintCollect\agent.log)
# log_file: "C:\\ProgramData\\PrintCollect\\agent.log"

# Configuracoes SNMP (descoberta de impressoras)
snmp:
  community: "public"
  timeout: 5
  subnets: []
  ips: []
