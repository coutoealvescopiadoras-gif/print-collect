# config.yaml DEFAULT para instalacao automatica
# URL oficial do servidor (Render Producao) - NAO ALTERE
server_url: "https://print-collect.onrender.com"

# Token de agente - sera substituido pelo Wizard de Pareamento
agent_token: "agent-dev-key"

# Versao do agente (v6.9.12 = CORRECAO DESINSTALACAO! v6.9.11 era bom mas tinha problema em remover: BAT unregister tinha PAUSE = trava runhidden, cmd_uninstall soh apagava tarefas antigas (7 nomes) e nao as novas de 6 camadas, ISS nao tinha waituntilterminated/runascurrentuser no UninstallRun, nao tinha UninstallDelete ProgramData, nao tinha InstallDelete instalacao POR CIMA. v6.9.12 corrige tudo isso! Mantem anti-travamento Wizard v6.9.11: CAMADA3/3 Python e BAT DESLIGADAS, coletas SNMP/rede intactas, split contadores P&B/Color/Total, toner CMYK separado coloridas, 30/30 min, 6 camadas tarefas, timeout USB.)
agent_version: "6.9.12"

# Intervalo de coleta em minutos (30 min = padrao do cliente Julio)
interval_minutes: 30

# Caminho do log (deixa comentado = usa C:\ProgramData\PrintCollect\agent.log)
# log_file: "C:\\ProgramData\\PrintCollect\\agent.log"

# Configuracoes SNMP (descoberta de impressoras)
snmp:
  community: "public"
  timeout: 5
  subnets: []
  ips: []
