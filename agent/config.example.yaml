# Print Collect — Coletor local (instalar no PC/servidor do cliente)
# Copie para config.yaml e preencha os valores

# URL da API central (PRODUCAO: Render)
server_url: "https://print-collect.onrender.com"

# Token do agente — crie em: Painel > Agentes > Novo agente
agent_token: "agent-dev-key"

# Versão (informativo) — v6.9.11: CORREÇÃO CRÍTICA v6.9.10! Build v6.9.10 subiu pro site com EXEs COMPILADOS ANTES dos fixes serem aplicados — os edits no __main__.py/usb.py foram aplicados no código fonte mas os .exe do PyInstaller ainda eram da versão ANTERIOR (ainda tinham CAMADA3/3 rodando coleta once no final do Wizard!). Além disso, CAMADA3/3 de coleta once TAMBÉM estava no register-startup-task-silent.bat (linha 294 validacao final) e NÃO tinha sido desligada lá também (causava RC=255 no BAT mesmo que o Python já tivesse desligado). v6.9.11 FAZ TODAS AS 3 LIMPEZAS ANTI-TRAVAMENTO E GARANTE QUE ELAS ESTÃO COMPILADAS DENTRO DO EXE + BAT: (1) CAMADA3/3 cmd_install Python DESLIGADA (nao roda once no Wizard) (2) USB->SNMP quick_read fallback REMOVIDO (3) collect_all_usb TIMEOUT GLOBAL 45s + (4) CAMADA3/3 register-startup-task-silent.bat TAMBÉM DESLIGADA (nao roda once no final do BAT). Todos os fluxos de rede SNMP, split contadores P&B/Color/Total, cards toner CMYK separados, mapeamento automatico de impressoras na rede, extra-targets servidor, agendamento 30/30 min, instalação manual de impressoras com SNMP: CONTINUAM 100% IGUAIS SEM NENHUMA ALTERACAO (apenas garantias anti-travamento no Wizard).
agent_version: "6.9.11"

# Intervalo entre coletas automáticas (minutos)
# 30 minutos = atualiza contadores de 30 em 30 min
interval_minutes: 30

# Log em arquivo (opcional — útil para diagnóstico)
# log_file: "/var/log/print-collect/agent.log"

# SNMP — rede local do cliente
snmp:
  community: "public"
  timeout: 2

  # Deixe vazio para o agente tentar descobrir automaticamente a rede local
  subnets: []

  # IPs fixos opcionais (use apenas se quiser forcar enderecos especificos)
  ips: []
  # Exemplo:
  # ips:
  #   - "192.168.1.100"
  #   - "192.168.1.101"
