# Print Collect — Coletor local (instalar no PC/servidor do cliente)
# Copie para config.yaml e preencha os valores

# URL da API central (PRODUCAO: Render)
server_url: "https://print-collect.onrender.com"

# Token do agente — crie em: Painel > Agentes > Novo agente
agent_token: "agent-dev-key"

# Versão (informativo) — v6.9.9: (1) PROTECAO TRAVAMENTO WIZARD: CAMADA 3/3 subprocess.run 'once' timeout=90s max, NAO TRAVA MAIS se coleta demorar. (2) _snmp_quick_read (USB->SNMP para impressoras manual TCP/IP tipo Canon WiFi) REESCRITO com ThreadPoolExecutor timeout 6.5s + 1 tentativa community public (antes 2 comunidades x 2 tentativas x 4s que podia TRAVAR UDP infinitamente em Canon G3111 no Joaquim causando Wizard nao fechar e contador zero). v6.9.8: (1) FIX v6.9.7 NameError 'os' / 'tempfile' faltavam imports no topo. (2) _wmic_csv_to_dicts SKIPA 1a coluna Node (hostname, wmic CSV SEMPRE tem) + QUOTING_MINIMAL correto. (3) Filtro FAKE_NAMES rigido no printer fallback. (4) Busca de PORTAS (TCPIPPrinterPort + printerport) VOLTA para /format:list provado v6.9.6.
agent_version: "6.9.9"

# Intervalo entre coletas automáticas (minutos)
# 30 minutos = atualiza contadores de 30 em 30 min
interval_minutes: 30

# Log em arquivo (opcional — útil para diagnóstico)
# log_file: "/var/log/print-collect/agent.log"

# SNMP — rede local do cliente
snmp:
  community: "public"
  timeout: 2

  # Deixe vazio para o agente tentar descobrir automaticamente a rede local
  subnets: []

  # IPs fixos opcionais (use apenas se quiser forcar enderecos especificos)
  ips: []
  # Exemplo:
  # ips:
  #   - "192.168.1.100"
  #   - "192.168.1.101"
