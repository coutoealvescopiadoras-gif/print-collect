# Print Collect — Coletor local (instalar no PC/servidor do cliente)
# Copie para config.yaml e preencha os valores

# URL da API central (PRODUCAO: Render)
server_url: "https://print-collect.onrender.com"

# Token do agente — crie em: Painel > Agentes > Novo agente
agent_token: "agent-dev-key"

# Versão (informativo) — v6.9.8: (1) FIX v6.9.7 NameError 'os' / 'tempfile' faltavam imports no topo. (2) _wmic_csv_to_dicts SKIPA 1a coluna Node (hostname, wmic CSV SEMPRE tem) + QUOTING_MINIMAL correto, senao gerava 83 impressoras FALSAS (Win32_ComputerSystem, DESKTOP-E02OP26, lista de papel). (3) Filtro FAKE_NAMES rígido no printer fallback, remove nomes invalidos. (4) Busca de PORTAS (TCPIPPrinterPort + printerport) VOLTA para /format:list provado v6.9.6 (38 portas reais). v6.9.7 CSV dava 261 falsas. Win32_Printer + PrintQueue CONTINUAM com /format:csv.
agent_version: "6.9.8"

# Intervalo entre coletas automáticas (minutos)
# 30 minutos = atualiza contadores de 30 em 30 min
interval_minutes: 30

# Log em arquivo (opcional — útil para diagnóstico)
# log_file: "/var/log/print-collect/agent.log"

# SNMP — rede local do cliente
snmp:
  community: "public"
  timeout: 2

  # Deixe vazio para o agente tentar descobrir automaticamente a rede local
  subnets: []

  # IPs fixos opcionais (use apenas se quiser forcar enderecos especificos)
  ips: []
  # Exemplo:
  # ips:
  #   - "192.168.1.100"
  #   - "192.168.1.101"
