# Print Collect — Coletor local (instalar no PC/servidor do cliente)
# Copie para config.yaml e preencha os valores

# URL da API central (PRODUCAO: Render)
server_url: "https://print-collect.onrender.com"

# Token do agente — crie em: Painel > Agentes > Novo agente
agent_token: "agent-dev-key"

# Versão (informativo) — v6.9.10: AJUSTES NUCLEARES ANTI-TRAVAMENTO Wizard + LIMPEZA CANON G3111. (1) CAMADA 3/3 do cmd_install: NAO RODA MAIS coleta 'once' automatica no final do Wizard (era a origem do travamento no Joaquim! Loop USB hang nao deixava Wizard mostrar tela final de ENTER para fechar). Wizard agora VAI DIRETO para tela final SEM ESPERAR NENHUMA coleta; primeira coleta roda nas proximas horas pela TAREFA AGENDADA 30 Minutos / Diario / Watchdog 10min. (2) LIMPEZA CANON G3111: REMOVIDO bloco fallback USB->SNMP _snmp_quick_read (tentava UDP em impressoras TCP/IP manual tipo Canon WiFi e TRAVAVA pysnmp OEM pt-BR). Impressoras TCP/IP manual agora vao DIRETO para fallbacks seguros registro Windows cumulativo + spooler historico (sem UDP, sem travamento). (3) TIMEOUT GLOBAL 45s no collect_all_usb() com ThreadPoolExecutor: mesmo que _collect_windows trave em qualquer ponto WMI/PowerShell/driver OEM, aborta em 45s retorna [] = Wizard e coleta principal continuam SEMPRE sem travar NUNCA MAIS. v6.9.8-v6.9.8 bugs OEM pt-BR (NameError os, 83 impressoras falsas, 261 portas falsas, MissingCatchOrFinally PS, duplicatas 3x, port=?) mantidos todos corrigidos. v6.9.8-v6.9.9 scaneamento automático rede (step3/4), split contadores (P&B / Color / Total), cards separados de toner (CMYK), extra-targets servidor, agendamento 30/30 min, coletas Konica/Ricoh/Epson coloridas: CONTINUAM 100% IGUAIS SEM NENHUMA ALTERACAO.
agent_version: "6.9.10"

# Intervalo entre coletas automáticas (minutos)
# 30 minutos = atualiza contadores de 30 em 30 min
interval_minutes: 30

# Log em arquivo (opcional — útil para diagnóstico)
# log_file: "/var/log/print-collect/agent.log"

# SNMP — rede local do cliente
snmp:
  community: "public"
  timeout: 2

  # Deixe vazio para o agente tentar descobrir automaticamente a rede local
  subnets: []

  # IPs fixos opcionais (use apenas se quiser forcar enderecos especificos)
  ips: []
  # Exemplo:
  # ips:
  #   - "192.168.1.100"
  #   - "192.168.1.101"
