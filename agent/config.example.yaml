# Print Collect — Coletor local (instalar no PC/servidor do cliente)
# Copie para config.yaml e preencha os valores

# URL da API central (PRODUCAO: Render)
server_url: "https://print-collect.onrender.com"

# Token do agente — crie em: Painel > Agentes > Novo agente
agent_token: "agent-dev-key"

# Versão (informativo) — v6.9.7: (1) _run_ps reescrito com ARQUIVO TEMPORÁRIO .ps1 UTF-8 BOM + powershell -File (resolver 100% MissingCatchOrFinally OEM pt-BR, scripts longos não passam por linha de comando). (2) Fallback WMIC Win32_Printer agora usa /format:csv (cabeçalhos SEMPRE inglês, NÃO localizado!) + helper _get_any_key com traduções pt-BR (NomeDaPorta, NomeDoDriver, Fabricante etc) + _wmic_csv_to_dicts. PortName NUNCA MAIS fica vazio (antes todas port=? no Joaquim!). (3) REMOVIDA CAMADA 2 PowerShell ScheduledTasks v6.4 (100% redundante, sempre dava HRESULT 0x80041318 em Windows pt-BR). Mantida CAMADA 1 schtasks (RC=0) + CAMADA 3 schtasks HOURLY (RC=0). Canon G3111 WiFi IP 192.168.15.50_1 agora aparece com IP REAL e SNMP.
agent_version: "6.9.7"

# Intervalo entre coletas automáticas (minutos)
# 30 minutos = atualiza contadores de 30 em 30 min
interval_minutes: 30

# Log em arquivo (opcional — útil para diagnóstico)
# log_file: "/var/log/print-collect/agent.log"

# SNMP — rede local do cliente
snmp:
  community: "public"
  timeout: 2

  # Deixe vazio para o agente tentar descobrir automaticamente a rede local
  subnets: []

  # IPs fixos opcionais (use apenas se quiser forcar enderecos especificos)
  ips: []
  # Exemplo:
  # ips:
  #   - "192.168.1.100"
  #   - "192.168.1.101"
