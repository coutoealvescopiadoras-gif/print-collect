# Print Collect — Coletor local (instalar no PC/servidor do cliente)
# Copie para config.yaml e preencha os valores

# URL da API central (PRODUCAO: Render)
server_url: "https://print-collect.onrender.com"

# Token do agente — crie em: Painel > Agentes > Novo agente
agent_token: "agent-dev-key"

# Versão (informativo) — v6.9.13: CORREÇÃO DEFINITIVA DESINSTALAÇÃO AGORA VISÍVEL E FUNCIONAL! v6.9.12 tinha bugs: (1) ISS [UninstallRun] com flag 'runhidden' = desinstalação INVISÍVEL (janela CMD não abria), usuário clica Desinstalar no Painel e NÃO VÊ NADA ACONTECENDO, pensa que não funciona; (2) [Dirs] ProgramData tinha flag 'uninsneveruninstall' que BLOQUEAVA 100% a remoção da pasta C:\ProgramData\PrintCollect mesmo com [UninstallDelete] declarado. v6.9.13: Retirado 'runhidden' (BAT e EXE uninstall aparecem em JANELA VISÍVEL, mostra passos a passos, mensagem de fim 'Pressione ENTER para fechar...'), retirado 'uninsneveruninstall' do [Dirs] ProgramData (agora UninstallDelete realmente apaga ProgramData com config e logs). Mantido 100% igual instalação: Wizard ENTER, 30/30 min Watchdog 10min, split contadores P&B / Color / Total, Toners CMYK separados, 16 variantes tarefas unregister etc.
agent_version: "6.9.13"

# Intervalo entre coletas automáticas (minutos)
# 30 minutos = atualiza contadores de 30 em 30 min
interval_minutes: 30

# Log em arquivo (opcional — útil para diagnóstico)
# log_file: "/var/log/print-collect/agent.log"

# SNMP — rede local do cliente
snmp:
  community: "public"
  timeout: 2

  # Deixe vazio para o agente tentar descobrir automaticamente a rede local
  subnets: []

  # IPs fixos opcionais (use apenas se quiser forcar enderecos especificos)
  ips: []
  # Exemplo:
  # ips:
  #   - "192.168.1.100"
  #   - "192.168.1.101"
