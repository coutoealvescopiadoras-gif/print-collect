# Print Collect — Coletor local (instalar no PC/servidor do cliente)
# Copie para config.yaml e preencha os valores

# URL da API central (PRODUCAO: Render)
server_url: "https://print-collect.onrender.com"

# Token do agente — crie em: Painel > Agentes > Novo agente
agent_token: "agent-dev-key"

# Versão (informativo) — v6.9.12: CORREÇÃO DESINSTALAÇÃO que não removia nada! 6 bugs fixados: (1) BAT unregister-startup-task.bat tinha 'pause' na linha final = Inno Setup UninstallRun (runhidden) TRAVAVA esperando ENTER para sempre; (2) cmd_uninstall Python só apagava 7 variantes ANTIGAS de tarefas — NÃO apagava as 6 novas (30 Minutos, Watchdog, Diario Repeticao, Ao Iniciar, Ao Logar) nem outras 4 variantes de bugs de builds antigas (Inicializacao, Coletar, Hora, Hourly, A Cada 1 Hora/HORA etc); agora são 16 variantes; (3) ISS [UninstallRun] faltavam flags waituntilterminated+runascurrentuser (esperar fim do BAT/EXE + rodar admin sem Acesso negado); (4) ISS não tinha [UninstallDelete] para ProgramData\PrintCollect (config.yaml, logs); (5) ISS não tinha [InstallDelete] para limpar EXEs antigos na instalação POR CIMA; (6) UninstallRun tinha SÓ BAT, não tinha garantia via EXE uninstall nativo; agora UninstallRun é dupla camada BAT + EXE. Mantido 100% igual: coletas SNMP, split contadores P&B/Color/Total, toner CMYK separado coloridas, mapeamento rede, 30/30min, tarefas agendadas 6 camadas, anti-travamento Wizard v6.9.11 (CAMADA3/3 desligada etc).
agent_version: "6.9.12"

# Intervalo entre coletas automáticas (minutos)
# 30 minutos = atualiza contadores de 30 em 30 min
interval_minutes: 30

# Log em arquivo (opcional — útil para diagnóstico)
# log_file: "/var/log/print-collect/agent.log"

# SNMP — rede local do cliente
snmp:
  community: "public"
  timeout: 2

  # Deixe vazio para o agente tentar descobrir automaticamente a rede local
  subnets: []

  # IPs fixos opcionais (use apenas se quiser forcar enderecos especificos)
  ips: []
  # Exemplo:
  # ips:
  #   - "192.168.1.100"
  #   - "192.168.1.101"
