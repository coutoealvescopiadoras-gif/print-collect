services:
  - type: web
    name: print-collect
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=server uvicorn app.main:app --host 0.0.0.0 --port 10000"
    rootDir: .
    healthCheckPath: /health
    autoDeploy: yes
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: AUTO_CREATE_TABLES
        value: "true"
