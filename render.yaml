services:
  - type: web
    name: print-collect-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: print-collect-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: print-collect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: AUTO_CREATE_TABLES
        value: true

databases:
  - name: print-collect-db
    databaseName: print_collect
    user: print_collect
    plan: free
