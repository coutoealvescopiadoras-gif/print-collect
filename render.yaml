services:
  - type: web
    name: printcollect-api
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker --chdir server app.main:app"
    rootDir: .
    healthCheckPath: /health
    autoDeploy: yes
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: printcollect-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: printcollect-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://printcollect.com.br,https://www.printcollect.com.br"
      - key: CORS_ORIGIN_REGEX
        value: "^https?://(printcollect\\.com\\.br|www\\.printcollect\\.com\\.br|[a-zA-Z0-9-]+\\.vercel\\.app|[a-zA-Z0-9-]+\\.onrender\\.com)(:\\d+)?$"

databases:
  - name: printcollect-db
    databaseName: printcollect
    user: printcollect
    plan: free
    ipAllowList:
      - source: "0.0.0.0/0"
        description: "Allow all (agents and dashboard)"
