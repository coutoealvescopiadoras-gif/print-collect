name: Build Print Collect Setup (Windows x86 32-bit Universal)

# Builda automaticamente TODA VEZ que:
#   - Voce der push na main (arquivos agent/* alterados)
#   - Ou publicar uma Release/tag no GitHub
# Ou voce pode disparar MANUALMENTE pela aba "Actions" do GitHub (WorkFlow Dispatch)
on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/build-setup-windows.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao do instalador (ex: 1.4.2) - usado no nome do artefato"
        required: false
        default: "latest"

jobs:
  build-setup:
    name: Build Setup.exe (Windows x86 32-bit Universal - roda em 100% dos PCs!)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout do codigo fonte
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.12 (x86 - 32 BITS - OBRIGATORIO para instalador Universal!)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x86"

      - name: 2.1. Validar arquitetura Python (garante que nao pegou x64 nem ARM64!)
        shell: pwsh
        run: |
          $arch = (python -c "import struct,sys; sys.stdout.write(str(struct.calcsize('P')*8))")
          Write-Host "Python ARQ: $arch bits"
          if ($arch -ne "32") { throw "ERRO: Python NAO e 32 bits (x86). Build cancelado! (pegou $arch bits sem querer)"}
          python --version

      - name: 3. Instalar Inno Setup (ISCC.exe - compilador do instalador Windows)
        shell: pwsh
        run: |
          $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
          if ($winget) {
            Write-Host "Instalando Inno Setup via winget..."
            & winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements
            Start-Sleep -Seconds 3
          }
          # Tenta localizar ISCC.exe apos instalacao:
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 5\ISCC.exe"
          )
          $found = $null
          foreach ($p in $paths) { if (Test-Path $p) { $found = $p; break } }
          if (-not $found) { throw "Inno Setup NAO ENCONTRADO apos instalacao. Instale manualmente." }
          Write-Host "Inno Setup OK: $found"
          # Adiciona no PATH para o script build-setup-x86.ps1 encontrar
          $dir = Split-Path -Parent $found
          echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 4. Rodar SCRIPT OFICIAL de build (.agent/windows/build-setup-x86.ps1)
        shell: pwsh
        run: |
          cd agent\windows
          $ErrorActionPreference = "Stop"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build-setup-x86.ps1

      - name: 5. Verificar arquitetura do EXE gerado (garante I386/x86 - NAO Code 216!)
        shell: pwsh
        run: |
          function Test-PEArch($path) {
            if (-not (Test-Path $path)) { Write-Host "FALTANDO $path"; exit 1 }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $e_lfanew = [BitConverter]::ToUInt32($bytes, 0x3C)
            $sig = [Text.Encoding]::ASCII.GetString($bytes, [int]$e_lfanew, 4)
            if ($sig -ne "PE`0`0") { Write-Host "$path nao e EXE PE valido!"; exit 1 }
            $machine = [BitConverter]::ToUInt16($bytes, [int]$e_lfanew + 4)
            $name = switch ($machine) {
              0x014c { "✅ I386 (x86 32-BITS = UNIVERSAL! OK!)" }
              0x8664 { "❌ AMD64 (x64) - NAO e o esperado!" }
              0xaa64 { "❌ ARM64 - ESTOURA ERRO CODE 216!"; exit 1 }
              default { "DESCONHECIDO machine=0x$($machine.ToString('X4'))" }
            }
            Write-Host "$((Get-Item $path).Name): $name"
          }
          Test-PEArch "agent\dist\PrintCollectAgent.exe"
          Test-PEArch "agent\dist\WizardPareamento.exe"
          Test-PEArch "agent\dist\SearchPrinters.exe"
          $setup = Get-ChildItem "agent\dist\windows\PrintCollectSetup.exe" -ErrorAction SilentlyContinue
          if (-not $setup) { Write-Host "SETUP.EXE NAO GERADO! FALHA TOTAL!"; exit 1}
          Test-PEArch $setup.FullName
          $size = [math]::Round($setup.Length / 1MB, 2)
          Write-Host "Tamanho Setup.exe final: $size MB"

      - name: 6. COPIAR SETUP.EXE para web/public/ (auto deploy download no site printcollect.com.br!)
        shell: pwsh
        run: |
          $src = Resolve-Path "agent\dist\windows\PrintCollectSetup.exe"
          $destDir = "web\public"
          if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }
          $dest = Join-Path $destDir "PrintCollectSetup.exe"
          Copy-Item $src $dest -Force
          # Tambem copia para pasta raiz (dist/) para facilitar download manual
          $distRoot = Join-Path (Get-Location) "PrintCollectSetup.exe"
          Copy-Item $src $distRoot -Force
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "latest" }
          $verFile = Join-Path $destDir "setup-version.txt"
          "$ver | $(Get-Date -Format 'yyyy-MM-dd HH:mm') | Commit ${{ github.sha }}" | Out-File -FilePath $verFile -Encoding utf8
          Write-Host "Copiado Setup.exe para: $dest e para raiz do projeto"
          Write-Host "Versao gravada em: $verFile"

      - name: 7. Upload Artifact (Setup.exe aparece 1 clique para baixar na aba Actions!)
        uses: actions/upload-artifact@v4
        with:
          name: PrintCollectSetup-${{ github.event.inputs.version || 'latest' }}
          path: |
            PrintCollectSetup.exe
            web/public/PrintCollectSetup.exe
          if-no-files-found: error
          retention-days: 90

      - name: 8. (OPCIONAL) Commit auto do Setup.exe em web/public/ para Vercel deployar auto? (desativado default - Nao recomendamos!)
        if: false
        shell: pwsh
        run: |
          # Voce pode ativar esse step depois se quiser auto-deploy o instalador no site.
          # Nao ativamos por padrao pois pode gerar loops de commit (Actions commit -> push -> Actions -> commit ...)
          Write-Host "Step desativado. Baixe manualmente na aba Artifacts do GitHub Actions (Step 7) e faca commit/push manual."
